# .github/workflows/autopilot.yml — Vorschlags-Autopilot, STUFE 1
# (Schritt QS-AUTOPILOT-STUFE1; Fahrplan fahrplaene/FAHRPLAN-PLAN-STEUERUNG.md
# § «Selbstoptimierender Bau»; Freigabe David 7.8.2026, wörtlich «stufe 1 ja»).
#
# WAS DIESER WORKFLOW TUT — und wo seine Grenze verläuft.
# Einmal in der Woche fährt er `npm run retro:17` (die Deutung der Bau-Messreihe,
# scripts/plan/retro17Kern.ts), schreibt dessen Ausgabe in eine Datei und eröffnet
# damit einen ENTWURFS-PR (`--draft`). Mehr nicht. Er merged nicht, er stellt
# keinen Auto-Merge scharf, er ändert ROADMAP.md nicht und er fasst keine Zeile
# des Plans an. Über die Übernahme jeder einzelnen Vorschlagszeile entscheidet
# eine Session bzw. David — genau wie bisher beim Aufruf von Hand.
#
# WARUM DIE GRENZE HIER LIEGT. Der Fahrplan zählt drei Autopilot-Stufen auf:
# Stufe 1 Vorschlag, Stufe 2 autonome Umsetzung auf Prozess-Fläche, Stufe 3
# autonomer Bau. Freigegeben ist ausdrücklich NUR Stufe 1; 2 und 3 brauchen je
# einen eigenen künftigen David-Entscheid. Wer diesen Workflow erweitert, prüft
# zuerst, ob er damit still eine nicht freigegebene Stufe einführt: ein
# `gh pr merge`, ein `--auto`, ein Commit auf `main` oder ein Schreibzugriff auf
# ROADMAP.md wären genau das.
#
# WARUM ER TROTZDEM ETWAS ÄNDERT. `retro:17` gab es seit 7.8.2026, es lief aber
# nur, wenn jemand daran dachte. Ein Werkzeug, dessen Wert an der Erinnerung
# einer Session hängt, wirkt nicht — dieselbe Fehlerklasse wie ein Wächter ohne
# Zeitplan (waechter.yml, Kopf). Der Cron ersetzt die Erinnerung, nicht das
# Urteil.
#
# ── Bewusste Auslassungen ───────────────────────────────────────────────────
#
# (1) KEIN `selbstopt:erheben`. Der Lauf erhebt KEINEN neuen Snapshot, er deutet
#     nur den committeten Bestand von `messwerte/selbstopt-zeitreihe.json`. Grund:
#     Erheben schriebe auf `main` — ein Schreibzugriff, den Stufe 1 nicht braucht
#     und nicht bekommt (least privilege). Folge, ehrlich benannt: die Frische
#     der Vorschläge hängt weiterhin daran, dass Sessions `npm run selbstopt:erheben`
#     fahren. Der Entwurf nennt darum das Datum der letzten Erhebung im Kopf; wer
#     einen alten Stand liest, sieht das sofort.
#
# (2) KEIN CI-Dispatch auf den Entwurfs-Zweig. fedlex-frische.yml stösst nach dem
#     Eröffnen `ci.yml` an, weil ihre PRs LANDEN sollen und dafür Required-Kontexte
#     brauchen. Dieser PR soll nie landen — er ist eine Lesefläche, aus der eine
#     Session Zeilen ENTNIMMT und die sie danach schliesst. Ein voller CI-Lauf pro
#     Woche für einen PR, der nie mergt, wäre reine Wanduhr.
#
# (3) KEIN Label. Das Repo führt (Stand 31.8.2026) keins, das passte; ein neues
#     Label anzulegen wäre Steuerungszuwachs ohne Anlass (§17-Gegengewicht).
#
# ── Bekannte Wechselwirkungen (nicht «behoben», sondern benannt) ────────────
#
# (a) waechter.yml, Schritt «Fehlende Required-Kontexte an offenen PRs nachziehen»
#     filtert Entwurfs-PRs NICHT heraus. Fände er an diesem PR fehlende Kontexte,
#     stiesse er wöchentlich `ci.yml` darauf an — genau der Lauf, den (2) vermeidet.
#     Real greift der Schritt zurzeit nie: die Branch-Schutz-Lesung gibt unter
#     `GITHUB_TOKEN` strukturell 403, der Schritt endet dann ohne Urteil (dort
#     dokumentiert, belegt an 5 Läufen 10.–14.8.2026). Hier wird das BENANNT und
#     nicht repariert, weil kein Fehlschlag reproduziert ist (§0 Ziff. 2) — wird
#     der 403 je behoben, gehört ein `isDraft`-Filter in jenen Schritt.
#
# (b) Vercel deployt Zweig-Pushes über seine GitHub-App; die GITHUB_TOKEN-
#     Rekursionssperre gilt für Actions, nicht für Apps. Der wöchentliche Push
#     erzeugt darum voraussichtlich EIN Preview-Deployment (4–5/Monat gegen ein
#     Tageslimit von 100). Der Bot-Commit trägt `[skip ci]`, was Vercel als
#     Skip-Signal auswertet — falls die App das ignoriert, bleibt es bei der einen
#     Vorschau pro Woche, was tragbar ist.
#
# (c) `check:ci-laeufe` (waechter.yml) findet diesen Workflow AUTOMATISCH — es
#     liest `.github/workflows/*.yml` und nimmt jeden mit `schedule:`-Trigger in
#     seine Prüfmenge (scripts/check-ci-laeufe.ts, Funktion `geplante`). Keine
#     Registrierung nötig, aber eine Folge: solange dieser Workflow KEINEN
#     abgeschlossenen Lauf hat, meldet das Tor «kein einziger abgeschlossener Lauf
#     — der Workflow startet nicht» und ist ROT. Direkt nach dem Merge ist darum
#     einmal `gh workflow run autopilot.yml` zu fahren (im PR-Body als
#     Nach-Merge-Schritt deklariert). Wochen-Intervall = 168 h, Kulanz 336 h.
name: Vorschlags-Autopilot (retro:17 → Entwurfs-PR)

on:
  schedule:
    # Montags 07:29 UTC — nach fedlex-frische (04:43), normen-monitor (05:17)
    # und dem Tages-Wächter (06:11), damit der Wächter den Vorwochen-Lauf schon
    # beurteilt hat und die Minute gegen die anderen Jobs entzerrt ist.
    - cron: '29 7 * * 1'
  workflow_dispatch:

permissions:
  # Genau zwei Rechte, beide für denselben einen Zweck (Entwurfs-PR eröffnen):
  #   contents: write       — den Zweig `autopilot/retro17-<datum>` pushen
  #   pull-requests: write  — `gh pr create --draft` (und `gh pr list` lesen)
  # KEIN `actions: write` (kein Dispatch, s. Auslassung 2), KEIN `issues: write`.
  # Ausdrücklich kein Schreibrecht auf `main`: der Push geht auf einen
  # Feature-Zweig, der keiner Branch-Protection unterliegt — deshalb reicht hier
  # `github.token` und es braucht KEINEN PAT (anders als plan-buchung.yml, das
  # auf `main` schreibt und dort an GH006 scheiterte).
  contents: write
  pull-requests: write

concurrency:
  group: autopilot
  # NIE `true`: ein abgebrochener Lauf endet `cancelled`, und `cancelled` zählt
  # in check:ci-laeufe als ROT (CLAUDE.md §6 Ziff. 7 lit. c, Vorfall turso-sync
  # 13.–20.7.2026). Lieber zwei Läufe hintereinander als ein grauer.
  cancel-in-progress: false

jobs:
  vorschlagen:
    name: retro:17 deuten und bei Befunden einen Entwurfs-PR eröffnen
    runs-on: ubuntu-latest
    # Grosszügig: der Lauf ist `npm ci` + ein vite-node-Skript (~3 min). 20 min
    # lassen Netz-Hänger zu, ohne dass je das 6-h-Hardlimit greift, das den Lauf
    # `cancelled` (= grau = unsichtbar) enden liesse.
    timeout-minutes: 20
    env:
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci

      # ── (1) Flut-Sperre: höchstens EIN offener Entwurfs-PR ──────────────────
      # Ein wöchentlicher PR, den niemand abarbeitet, ergäbe 52 offene PRs im
      # Jahr — Rauschen, das die echte Information begräbt. Steht schon ein
      # Autopilot-Entwurf offen, IST er der hängige Vorschlag; ein zweiter
      # fügte nichts hinzu. Der Lauf endet dann GRÜN (das ist kein Ausfall) und
      # meldet die Lage als `::notice::`.
      - name: Offenen Entwurfs-PR suchen (Flut-Sperre)
        id: offen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          nr=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("autopilot/retro17-"))]
                       | sort_by(.number) | .[0].number // empty')
          if [ -n "$nr" ]; then
            echo "::notice::Autopilot-Entwurf #${nr} ist noch offen — kein zweiter PR. Erst abarbeiten oder schliessen."
            echo "weiter=false" >> "$GITHUB_OUTPUT"
          else
            echo "Kein offener Autopilot-Entwurf — Lauf geht weiter."
            echo "weiter=true" >> "$GITHUB_OUTPUT"
          fi

      # ── (2) retro:17 fahren, Ausgabe in eine Datei ──────────────────────────
      # `retro:17` schreibt selbst nichts (das ist sein wichtigstes Merkmal,
      # scripts/plan/retro-17.ts Kopf) — die Umleitung passiert HIER, ausserhalb
      # des Werkzeugs. Das Skript bleibt damit unverändert das, was es lokal ist.
      #
      # FEHLERSEITE (§6.7): ist die Messreihe nicht schema-valide, endet retro:17
      # mit Exit 1 — unter `set -o pipefail` wird dieser Schritt und damit der Job
      # ROT, und es entsteht KEIN PR. Das ist gewollt: aus kaputten Zahlen einen
      # Plan-Vorschlag zu bauen wäre schlimmer als kein Vorschlag.
      - name: retro:17 ausführen
        if: steps.offen.outputs.weiter == 'true'
        run: |
          set -euo pipefail
          npm run --silent retro:17 > /tmp/retro17.txt
          cat /tmp/retro17.txt

      # ── (3) Enthält der Entwurf Kandidaten? ─────────────────────────────────
      # Gezählt wird die ENTWURF-Marke aus scripts/plan/retro17Kern.ts
      # (`export const ENTWURF_MARKE`) — sie steht per Definition genau einmal
      # unter jeder maschinell erzeugten Vorschlagszeile. Das ist die belastbare
      # Sonde: keine Deutung eines Fliesstextes, sondern das Abzählen der Marke,
      # die das Werkzeug selbst als Erkennungsmerkmal führt. Null Marken heisst
      # zuverlässig «kein Vorschlag» — sowohl bei «keine Auffälligkeit über den
      # Schwellen» als auch bei «KEINE DATENLAGE».
      #
      # `grep -c` liefert Exit 1 bei null Treffern; das `|| true` fängt genau das
      # ab und NUR das (die Zahl steht danach trotzdem in $n).
      - name: Kandidaten zählen
        id: zaehlen
        if: steps.offen.outputs.weiter == 'true'
        run: |
          set -euo pipefail
          marke='<!-- ENTWURF retro:17 — Übernahme nur durch Session-/David-Entscheid -->'
          n=$(grep -cF "$marke" /tmp/retro17.txt || true)
          echo "anzahl=${n}" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::notice::retro:17 fand keine Auffälligkeit über den gesetzten Schwellen — kein Entwurfs-PR (das ist der gute Fall)."
          else
            echo "${n} Vorschlagsblöcke gefunden — Entwurfs-PR wird eröffnet."
          fi

      # ── (4) Entwurfs-PR eröffnen ────────────────────────────────────────────
      # Die retro:17-Ausgabe ist DATEN, nie Skripttext: sie erreicht Datei und
      # PR-Body ausschliesslich über Umleitung bzw. `--body-file`, nie über eine
      # `${{ }}`-Einsetzung in einen `run:`-Block (§14.7 / Dispatch-§0 Ziff. 1 —
      # dieselbe Sorgfalt wie beim PR-Body-Fallback in plan-buchung.yml).
      #
      # Der PR-Body trägt BEWUSST KEINE `Roadmap:`/`Roadmap-Status:`-Trailer:
      # plan-buchung.yml liest PR-Bodies als Buchungs-Fallback, und ein Entwurf
      # darf nie versehentlich einen Plan-Stand buchen.
      - name: Entwurf committen und Entwurfs-PR eröffnen
        if: steps.offen.outputs.weiter == 'true' && steps.zaehlen.outputs.anzahl != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ANZAHL: ${{ steps.zaehlen.outputs.anzahl }}
        run: |
          set -euo pipefail
          datum=$(date +%F)
          zweig="autopilot/retro17-${datum}"
          datei="messwerte/autopilot/retro17-entwurf-${datum}.md"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$zweig"
          mkdir -p messwerte/autopilot

          {
            echo "# retro:17 — ENTWURF vom ${datum} (Vorschlags-Autopilot, Stufe 1)"
            echo
            echo "**Status: ENTWURF. Übernahme nur durch Session-/David-Entscheid.**"
            echo
            echo "Maschinell erzeugt von \`.github/workflows/autopilot.yml\` (Wochen-Cron) aus"
            echo "\`npm run retro:17\`. Der Autopilot merged nichts, ändert \`ROADMAP.md\` nicht und"
            echo "vergibt keine \`@meta\`-Etiketten — er legt nur vor. Wer eine Zeile übernimmt,"
            echo "vergibt selbst ID und \`@meta\` und verantwortet sie als eigenen Entscheid."
            echo
            echo "Diese Datei ist **nicht zum Mergen** gedacht: sie ist die Lesefläche des PR."
            echo "Nach dem Abarbeiten wird der PR geschlossen, nicht gelandet."
            echo
            echo '```'
            cat /tmp/retro17.txt
            echo '```'
          } > "$datei"

          git add "$datei"
          # `[skip ci]`: dieser Commit soll keinen Bau auslösen (s. Auslassung 2
          # und Wechselwirkung (b) im Kopf). Commit-Typ `chore(` — nie `refactor(`,
          # das verbietet check:testtreue für Commits, die Tests berühren könnten.
          git commit -m "chore(autopilot): retro:17-Entwurf vom ${datum} (${ANZAHL} Vorschlagsblöcke) [skip ci]"
          git push -u origin "$zweig"

          {
            echo "## ENTWURF — Übernahme nur durch Session-/David-Entscheid"
            echo
            echo "Wöchentlicher Lauf des Vorschlags-Autopiloten (Stufe 1, Freigabe David 7.8.2026)."
            echo "\`npm run retro:17\` meldet **${ANZAHL} Vorschlagsblöcke** über den gesetzten Schwellen."
            echo
            echo "**Dieser PR wird nicht gemergt.** Er ist eine Lesefläche: eine Session prüft die"
            echo "Vorschläge, übernimmt die tragfähigen von Hand in \`ROADMAP.md\` (mit selbst"
            echo "vergebener ID und \`@meta\`) und schliesst den PR danach. Kein Auto-Merge, keine"
            echo "Plan-Änderung durch die Automatik — Stufe 2 und 3 sind ausdrücklich nicht freigegeben."
            echo
            echo "Vollständiger Entwurf: \`${datei}\` (auch unten im Diff)."
            echo
            echo "---"
            echo
            cat /tmp/retro17.txt
          } > /tmp/pr-body.md

          gh pr create --repo "$REPO" --base main --head "$zweig" --draft \
            --title "ENTWURF (Autopilot) — retro:17-Vorschläge vom ${datum}, Übernahme nur durch Session-/David-Entscheid" \
            --body-file /tmp/pr-body.md
