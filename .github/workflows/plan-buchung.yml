# .github/workflows/plan-buchung.yml — Buchhaltungs-Automation nach Merge
# (QS-PLAN-EINFACH, 14.8.2026, Punkt 1; Auftrag David).
#
# BISHER: nach jeder Landung setzte die Session von Hand `npm run plan:set --
# <ID> status=<wert>` + push — ein Zweitschritt, der leicht vergessen wird
# (Beleg: 9a57976fb «Wächter ist seit 3 Tagen selbst rot» — Status im ROADMAP.md
# hinkte dem realen Stand nach).
#
# JETZT: trägt der Squash-Commit auf `main` BEIDE Trailer
#   Roadmap: <ID>
#   Roadmap-Status: done | ready | parked(<blocker-token>)
# bucht dieser Workflow den Status automatisch nach — die Absicht steht schon
# im Commit, ein separater Hand-Schritt ist redundant. Trailer-Parsen und
# -Validieren sitzt in `scripts/plan/buchung.ts` (Vitest-getestet, §6.7-Beweis
# dort) — dieser Workflow ruft das Skript nur auf und verdrahtet es mit den
# bestehenden Werkzeugen `plan:set`/`check:plan`.
#
# FEHLERSEITE (§6.7): ein ungültiger Status-Wert oder eine unbekannte ID lässt
# den Job ROT enden, BEVOR etwas committet wird — nie ein unwahrer Plan-Stand.
#
# FALLBACK (Lehre 14.8.2026, real bei PR #491): fehlt der Trailer im
# Squash-Commit — z. B. weil GitHub Auto-Merge bei mehreren Commits den
# Standard-Squash-Text nimmt (nur verkettete Subjects, kein Body) — wird die
# Buchungs-Absicht ersatzweise aus dem PR-BODY gelesen (PR-Nummer aus der
# Commit-Subject-Endung "(#N)", danach verifiziert: state MERGED UND
# mergeCommit.oid == dieser Commit, sonst still kein Fallback — B1-2).
# Details bei den Schritten "PR-Nummer …", "PR gegen den Squash-Commit
# verifizieren …" und "Trailer aus PR-Body lesen (Fallback)" unten.
#
# SELBST-TRIGGER-GUARD: der von diesem Workflow erzeugte Buchungs-Commit trägt
# selbst keinen `Roadmap-Status`-Trailer (siehe Commit-Message unten), der
# Trailer-Schritt fände hier also ohnehin nichts. Der Actor-/Autor-Guard ist
# trotzdem verdrahtet (Belt+Suspenders, wie `merge-schutz` in ci.yml) — er
# verlässt den Job, BEVOR überhaupt ausgecheckt wird, egal was ein künftiger
# Commit-Wortlaut zufällig trüge. Ergänzend gilt ohnehin GitHubs eingebaute
# Rekursionssperre: von `GITHUB_TOKEN` erzeugte push-Events lösen keine
# Workflow-Läufe aus (siehe waechter.yml, K2/K11-Kommentar) — der Guard hier
# ist zusätzliche Sicherung, keine notwendige.
name: Plan-Buchung (Merge-Trailer → ROADMAP.md)

on:
  push:
    branches: [main]

permissions:
  contents: write
  # Minimal für den PR-Body-Fallback (Lehre 14.8.2026, PR #491, siehe unten):
  # `gh pr view --json body` braucht Lesezugriff auf Pull Requests, sonst nichts.
  pull-requests: read

concurrency:
  group: plan-buchung-${{ github.ref }}
  cancel-in-progress: false

jobs:
  buchen:
    name: Roadmap-Status aus Merge-Trailer buchen
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.author.username != 'github-actions[bot]'
    env:
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v7
        with:
          # PAT-Weg (Entscheid David 14.8.2026, Chat «machen wir pat»): der
          # Buchungs-Push muss die Branch-Protection passieren — das kann nur
          # ein Token mit Davids Bypass (Geburts-Rotlauf 14.8.2026, Run
          # 31830331265: GH006 mit dem Standard-GITHUB_TOKEN). Solange das
          # Secret PLAN_BUCHUNG_TOKEN fehlt, fällt der Ausdruck auf
          # github.token zurück — Verhalten wie bisher (Push scheitert laut,
          # Hand-Buchung nach Skill landung Schritt 9). PAT-Pushes lösen
          # anders als GITHUB_TOKEN wieder Workflows aus; darum trägt der
          # Buchungs-Commit unten [skip ci].
          token: ${{ secrets.PLAN_BUCHUNG_TOKEN || github.token }}

      # `%(trailers:key=…,valueonly)` liest nur echte Trailer-Zeilen am
      # Commit-Ende (wie check-merge-schutz.ts) — keine beiläufige Erwähnung
      # im Fliesstext. Fehlt einer der beiden, ist das KEIN Fehler, sondern der
      # weit häufigere Normalfall («normaler» Merge ohne Buchungs-Absicht) —
      # der Job endet hier still mit Exit 0.
      - name: Trailer aus dem Head-Commit lesen
        id: trailer
        run: |
          set -euo pipefail
          ROADMAP=$(git log -1 --format='%(trailers:key=Roadmap,valueonly)' | tr -d '\n')
          STATUS=$(git log -1 --format='%(trailers:key=Roadmap-Status,valueonly)' | tr -d '\n')
          if [ -z "$ROADMAP" ] || [ -z "$STATUS" ]; then
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "Kein vollständiger Buchungs-Trailer im Head-Commit (Roadmap='${ROADMAP}', Roadmap-Status='${STATUS}') — nichts zu tun."
            exit 0
          fi
          echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          echo "roadmap=${ROADMAP}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "Buchungs-Trailer gefunden: Roadmap=${ROADMAP} · Roadmap-Status=${STATUS}"

      # FALLBACK (Lehre 14.8.2026, real bei PR #491): GitHub Auto-Merge nimmt
      # bei einem Squash mit MEHREREN Commits den Standard-Text — nur die
      # verketteten Commit-Subjects, endet auf "Co-authored-by". Ein Trailer,
      # der nur im BODY eines Zwischen-Commits stand, erreicht den
      # Squash-Commit dann nie; der Buchungs-Schritt oben bleibt (korrekt
      # fail-safe) still. Ersatzweise: PR-Nummer aus der Commit-Subject-Endung
      # "(#N)" lesen (das hängt GitHub bei jedem Squash-Merge an) und die
      # Trailer aus dem PR-BODY lesen — dort steht die Absicht unverändert.
      # Kein "(#N)"-Suffix (z. B. ein Commit ohne zugehörigen PR) -> weiterhin
      # still, kein Fallback möglich.
      - name: PR-Nummer aus Commit-Subject extrahieren (Fallback)
        id: pr
        if: steps.trailer.outputs.vorhanden == 'false'
        run: |
          set -euo pipefail
          SUBJECT=$(git log -1 --format='%s')
          if [[ "$SUBJECT" =~ \(#([0-9]+)\)[[:space:]]*$ ]]; then
            echo "nummer=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "PR-Nummer aus Commit-Subject: #${BASH_REMATCH[1]}"
          else
            echo "Kein '(#N)'-Suffix im Commit-Subject — kein PR-Body-Fallback möglich."
          fi

      # AUFLAGE B1-2 (Gegenprüfung 14.8.2026): "(#N)" am Commit-Subject-Ende
      # ist NICHT zwingend ein PR — GitHub hängt dieselbe Endung auch bei
      # Issue-Bezügen an, und selbst bei einer echten PR-Nummer könnte #N
      # inzwischen ein ANDERER, späterer Merge sein. Vor dem Body-Lesen wird
      # darum verifiziert, dass #N wirklich der PR ist, dessen Squash-Merge
      # GENAU DIESEN Commit erzeugt hat: `state` MERGED und `mergeCommit.oid`
      # gleich dem aktuellen Commit (`$GITHUB_SHA` — von Actions automatisch
      # gesetzter Runner-Env-Var, kein `${{ }}`-Kontextausdruck nötig). JEDER
      # Fehlschlag bleibt STILL: falsche/fremde Nummer, kein PR (Issue),
      # gh-API-Fehler — das ist der weit häufigere Normalfall (ein Commit ohne
      # zugehörigen, hierher passenden PR), kein Fehlerzustand des Jobs.
      - name: PR gegen den Squash-Commit verifizieren (Fallback)
        id: pr_verify
        if: steps.trailer.outputs.vorhanden == 'false' && steps.pr.outputs.nummer != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMMER: ${{ steps.pr.outputs.nummer }}
        run: |
          set -uo pipefail
          AUSGABE=$(gh pr view "$PR_NUMMER" --json state,mergeCommit \
            --jq '(.state // "") + "|" + (.mergeCommit.oid // "")' 2>&1)
          if [ $? -ne 0 ]; then
            echo "gh pr view #${PR_NUMMER} fehlgeschlagen (z. B. Issue statt PR, kein Zugriff) — kein Fallback: ${AUSGABE}"
            echo "bestaetigt=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATE="${AUSGABE%%|*}"
          OID="${AUSGABE#*|}"
          if [ "$STATE" = "MERGED" ] && [ -n "$OID" ] && [ "$OID" = "$GITHUB_SHA" ]; then
            echo "bestaetigt=true" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMMER} verifiziert: state=MERGED, mergeCommit=${OID}."
          else
            echo "PR #${PR_NUMMER} nicht bestätigt (state=${STATE:-leer}, mergeCommit=${OID:-leer}, erwartet=${GITHUB_SHA}) — kein Fallback."
            echo "bestaetigt=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Node-Umgebung ERST HIER (M5, QS-CI-MINUTEN, 8.9.2026) ──────────────
      # BISHER standen `setup-node` + `npx -y npm@11 ci` direkt nach dem
      # Checkout — also bei JEDEM main-Push, obwohl node_modules erst ab dem
      # nächsten Schritt (`vite-node scripts/plan/buchung.ts`) gebraucht wird
      # und «kein Buchungs-Trailer» der belegte Normalfall ist. Messung
      # 8.9.2026 (bibliothek/betrieb/ci-minuten-sparplan-2026-09-08.md §2 M5):
      # 299 Läufe à 1.14 min, davon der überwiegende Teil reine Installation
      # für einen Job, der gleich darauf still mit Exit 0 endet.
      # JETZT: nur, wenn wirklich gebucht wird — Commit-Trailer gefunden ODER
      # PR-Body-Fallback bestätigt. Die drei Schritte davor brauchen kein Node
      # (git bzw. `gh`, beide auf dem Runner vorinstalliert).
      # KEIN Verhaltensunterschied: jeder Pfad, der buchen WILL, bekommt die
      # Umgebung unverändert; die Fehlerseite (§6.7) ist unberührt, weil ein
      # fehlender Trailer schon vorher still mit Exit 0 endete.
      - uses: actions/setup-node@v5
        if: >-
          steps.trailer.outputs.vorhanden == 'true' ||
          steps.pr_verify.outputs.bestaetigt == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
        if: >-
          steps.trailer.outputs.vorhanden == 'true' ||
          steps.pr_verify.outputs.bestaetigt == 'true'

      # PR-Body ist FREMDTEXT (Daten, nie Code, §14.7 Dispatch-Klausel): er
      # fliesst nur über STDIN in buchung.ts und von dort — wie der
      # Commit-Trailer-Pfad oben — NUR über `env:` in die Folge-Schritte, nie
      # über `${{ }}` in einen `run:`-Skripttext. buchung.ts interpretiert den
      # Body als Trailer-Block (git-Konvention) und validiert Roadmap-ID sowie
      # Blocker-Token gegen denselben engen Zeichensatz wie beim Commit-Trailer
      # (Gegenprüfungs-Befund 14.8.2026) — ein Injection-Versuch im PR-Body
      # wird damit genauso hart abgewiesen. Kein Trailer-Block im Body -> Exit
      # 0 ohne Ausgabe (still, `steps.buchung_fallback.outputs.id` bleibt
      # leer); ein gefundener, aber ungültiger Trailer -> Exit 1 (Job rot,
      # §6.7).
      - name: Trailer aus PR-Body lesen (Fallback)
        id: buchung_fallback
        if: steps.trailer.outputs.vorhanden == 'false' && steps.pr_verify.outputs.bestaetigt == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMMER: ${{ steps.pr.outputs.nummer }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMMER" --json body -q .body | npx vite-node scripts/plan/buchung.ts --pr-body >> "$GITHUB_OUTPUT"

      # Trailer-Parsen + Validierung (scripts/plan/buchung.ts). Die Datei gibt
      # bei Erfolg genau `id=…`/`status=…`/`blocker=…`-Zeilen aus — das ist
      # bereits GITHUB_OUTPUT-Format, darum die direkte Umleitung. Wirft die
      # Validierung (ungültiger Status, "parked" ohne Blocker-Token), endet
      # dieser Schritt mit Exit 1 — der Job wird ROT, `plan:set` läuft NIE.
      # SICHERHEIT (Gegenprüfungs-Befund 14.8.2026): Trailer-Werte stammen aus
      # dem Commit-Text und sind beeinflussbar — sie erreichen die Shell darum
      # NUR über `env:` (Variablen-Expansion, keine Kommando-Substitution),
      # NIE über `${{ }}` im `run:`-Skripttext (dort würde ein `$(…)` im Wert
      # ausgeführt). Zusätzlich validiert buchung.ts ID/Token gegen einen
      # engen Zeichensatz, bevor irgendetwas weiterläuft.
      - name: Trailer parsen + validieren
        if: steps.trailer.outputs.vorhanden == 'true'
        id: buchung
        env:
          ROADMAP_TRAILER: ${{ steps.trailer.outputs.roadmap }}
          STATUS_TRAILER: ${{ steps.trailer.outputs.status }}
        run: |
          set -euo pipefail
          npx vite-node scripts/plan/buchung.ts -- "$ROADMAP_TRAILER" "$STATUS_TRAILER" >> "$GITHUB_OUTPUT"

      # Bedingung ab hier deckt BEIDE Quellen ab: Commit-Trailer (steps.buchung,
      # Priorität) oder PR-Body-Fallback (steps.buchung_fallback). Der
      # `||`-Operator in den env-Zuweisungen wählt die erste nicht-leere Quelle
      # — strukturell kann nur eine der beiden je nicht-leer sein, weil
      # `buchung_fallback` nur läuft, wenn der Commit-Trailer fehlte.
      - name: ROADMAP.md nachziehen (plan:set)
        if: >-
          steps.trailer.outputs.vorhanden == 'true' ||
          steps.buchung_fallback.outputs.id != ''
        env:
          BUCHUNG_ID: ${{ steps.buchung.outputs.id || steps.buchung_fallback.outputs.id }}
          BUCHUNG_STATUS: ${{ steps.buchung.outputs.status || steps.buchung_fallback.outputs.status }}
          BUCHUNG_BLOCKER: ${{ steps.buchung.outputs.blocker || steps.buchung_fallback.outputs.blocker }}
        run: |
          set -euo pipefail
          npm run plan:set -- "$BUCHUNG_ID" status="$BUCHUNG_STATUS"
          if [ -n "$BUCHUNG_BLOCKER" ]; then
            npm run plan:set -- "$BUCHUNG_ID" blocker="$BUCHUNG_BLOCKER"
          fi

      # Konsistenz-Tor VOR dem Commit (§6.7: "ist check:plan rot ⇒ Job ROT und
      # KEIN Commit — nie einen unwahren Plan committen").
      - name: check:plan (Konsistenz-Tor)
        if: >-
          steps.trailer.outputs.vorhanden == 'true' ||
          steps.buchung_fallback.outputs.id != ''
        run: npm run check:plan

      # `plan:bild` (Lagebild) erzeugt NUR eine gitignorierte Datei
      # (tmp/plan-bild.html, siehe .gitignore Z. 98 `tmp/`) — kein committetes
      # Artefakt, geprüft per `git status` nach einem lokalen Lauf. Hier darum
      # bewusst NICHT ausgeführt: es gäbe nichts zusätzlich zu committen.
      - name: ROADMAP.md committen und pushen
        if: >-
          steps.trailer.outputs.vorhanden == 'true' ||
          steps.buchung_fallback.outputs.id != ''
        env:
          BUCHUNG_ID: ${{ steps.buchung.outputs.id || steps.buchung_fallback.outputs.id }}
          BUCHUNG_STATUS: ${{ steps.buchung.outputs.status || steps.buchung_fallback.outputs.status }}
        run: |
          set -euo pipefail
          if git diff --quiet -- ROADMAP.md; then
            echo "ROADMAP.md unverändert (Status entsprach bereits dem Trailer) — kein Commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          # [skip ci]: mit PAT getriggerte Folge-Läufe unterbinden (GitHubs
          # GITHUB_TOKEN-Rekursionssperre greift für PAT-Pushes NICHT; der
          # Actor-Guard oben auch nicht, denn der PAT-Actor ist David).
          git commit -m "docs(plan): $BUCHUNG_ID -> $BUCHUNG_STATUS (automatisch aus Merge-Trailer) [skip ci]"
          # Push-Race (Gegenprüfung, nachrangig): zwischen Trigger-SHA und jetzt
          # kann ein weiterer Merge gelandet sein — Rebase statt non-fast-forward-Rot.
          git pull --rebase origin main
          npm run check:plan
          git push origin HEAD:main
