# ─── Fedlex-Frische-Automatik (O-2, QS-OPT / QS-CURRENCY) ───────────────────
# Der REPARATUR-Arm des Frische-Kreislaufs (der Normen-Monitor ist der Detektions-
# Arm). Drei Schritte, alle rein amtlich (Fedlex-SPARQL):
#   1. gen:fedlex-wiedervorlage  — currency.json + AUTO-Wiedervorlage-Block frisch
#      halten (Reader-Chips «geltend geprüft am …» bleiben ≤7 Tage alt).  [O-2.2]
#   2. fedlex:repin-batch --write — ALLE überholten Bund-Pins (geltende
#      Konsolidierung ≤ heute > Pin) auf die geltende Fassung heben, Snapshots +
#      Struktur regenerieren, Normtext-Tore fahren.  [O-2.1]
#   3. check:fedlex-versionen + fedlex:repin-kanonik --write — die ZWEITE
#      Re-Pin-Achse: nicht das Konsolidierungsdatum, sondern die html-REVISION
#      (isExemplifiedBy). Seit 3.8.2026, weil Erkennen ohne Reparieren hier
#      belegbar folgenlos blieb (siehe Schritt-Kommentar unten).
# Ergibt sich ein Diff, wird EIN Auto-Merge-PR eröffnet (David-Rahmen-Gate 16.7.2026:
# «Ja, voll freigeben» — scheduled Daten-Reparatur-PRs dürfen bei grünen Toren
# unbeaufsichtigt auto-mergen; main deployt auf Prod). Überholte Erlasse ohne
# auflösbare html-Manifestation (Handschritt) melden einen sichtbaren Aufgaben-Zettel.
#
# Getrennt von normen-monitor.yml gehalten (eigene Datei): Detektion ≠ Reparatur,
# und vermeidet die Kollision mit dem parallelen O-1-Monitor-Umbau (#244).
name: Fedlex-Frische-Automatik

on:
  schedule:
    - cron: '43 4 * * 1' # montags 04:43 UTC (vor dem 07:17-Monitor; Abstand seit 1.9.2026 2,5 h, s. normen-monitor.yml)
  workflow_dispatch:

# Auto-Merge-PRs, die von github.token erstellt werden, lösen KEINE CI aus (GH-
# Rekursionssperre). Ist ein PAT als Secret AUTOMERGE_TOKEN hinterlegt, wird es
# genutzt (dann läuft die CI von selbst).
#
# STAND 3.8.2026 (K1): AUTOMERGE_TOKEN existiert NICHT (`gh secret list` kennt
# nur TURSO_AUTH_TOKEN), es greift also immer der github.token-Zweig. Die Folge
# war belegbar: die Läufe 30795814361 und 30795814304 blieben in
# `action_required` stehen, der Bot-PR trug keinen einzigen Required-Kontext.
# Der Hinweis «CI ggf. manuell anstossen» im PR-Body war die ganze Vorsorge —
# eine Bitte an einen Menschen, also keine.
# Codeseitiger Fix unten: nach der PR-Eröffnung wird ci.yml explizit per
# `gh workflow run` gestartet (workflow_dispatch ist die dokumentierte Ausnahme
# von der Rekursionssperre). Der WURZEL-Fix bleibt ein fein granulierter PAT als
# AUTOMERGE_TOKEN — den kann nur David anlegen.
concurrency:
  group: fedlex-frische
  cancel-in-progress: false

jobs:
  frische:
    name: Wiedervorlage-Refresh · Batch-Re-Pin
    runs-on: ubuntu-latest
    # 45 statt 30 seit 29.8.2026: der Tor-Schritt fährt jetzt die volle
    # Tor-Menge (`npm run check` + `npm test`) statt acht handverlesener Tore.
    timeout-minutes: 45
    env:
      # Zeitzone wie in ci.yml (dort mit derselben Begründung, Zeilen 79–83): die
      # Golden-Basis ist in Europe/Zurich erzeugt, GitHub-Runner laufen in UTC.
      # Ohne diese Zeile vergleicht der `golden:vergleich`-Schritt unten
      # Zürich-Basiswerte gegen UTC-berechnete und meldet zwangsläufig genau die
      # zwei zeitzonenabhängigen Fälle `kuendigung:dj1` + `kuendigung:dj10` als
      # abweichend (die anderen 247 sind TZ-neutral).
      #
      # DAS WAR DIE URSACHE des einzigen Fehlschlags dieses Workflows
      # (20.7.2026, Auftakt-Lauf) — nicht die Regenerierungs-Schritte, wie
      # `bibliothek/register/AUDIT-TORE-2026-07-20.md` §6 vermutete und dort
      # ausdrücklich als offen vermerkte. Am 26.7.2026 identisch reproduziert:
      # `golden:vergleich` ohne TZ meldet exakt dieses Fallpaar, mit
      # `TZ=Europe/Zurich` sind alle 249 Fälle byte-gleich.
      TZ: Europe/Zurich
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # `actions: write` seit 3.8.2026 (K1): der Reparatur-PR stösst seine CI
      # selbst per `gh workflow run` an — von `github.token` erzeugte PR-Events
      # lösen keine Workflows aus.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci

      - name: Laufdatum festlegen (§2 — kein Date.now in der Erhebung)
        id: datum
        run: echo "iso=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Wiedervorlage + Currency frisch halten (O-2.2)
        run: npm run gen:fedlex-wiedervorlage -- --datum=${{ steps.datum.outputs.iso }}

      - name: Batch-Re-Pin überholter Pins (O-2.1)
        id: repin
        run: |
          set -uo pipefail
          npm run fedlex:repin-batch -- --datum=${{ steps.datum.outputs.iso }} --write | tee repin.log
          # Handschritt-Fälle (überholt, aber html-N nicht auflösbar) markieren.
          if grep -q '⚠' repin.log; then echo "handschritt=1" >> "$GITHUB_OUTPUT"; fi

      # ── Kanonik-Selbstheilung (3.8.2026) ────────────────────────────────────
      # ZWEITE Re-Pin-Achse, unabhängig von der ersten: der Batch oben hebt
      # überholte KONSOLIDIERUNGSDATEN (3. Pipe-Feld), dieser Schritt die
      # nicht-kanonische html-REVISION (4. Feld). Fedlex registriert je Fassung
      # genau eine Manifestation (isExemplifiedBy); zeigt der Pin auf eine
      # andere, liefert der Filestore einen Alt-Generations-Dump — also
      # amtlichen Text, aber nicht den geltenden.
      #
      # WARUM HIER UND NICHT WEITER ZUSCHAUEN: Am 3.8.2026 standen 8 Pins
      # nicht-kanonisch (zgb 1→2, mwstg 3→4, bbg 2→3, usg 0→1, gwg 6→7,
      # kag 6→7, fza 5→9, cmr 3→6). Der Kanonik-Arbiter in
      # `check:fedlex-versionen` hatte sie erkannt und der Normen-Monitor war
      # seit dem 29.6. rot — beides wochenlang folgenlos, weil der Befund nur
      # DETEKTION war und niemand den Reparatur-Handgriff tat. Erkennen ohne
      # Reparieren erzeugt genau die Alarm-Müdigkeit, gegen die dieser Workflow
      # als REPARATUR-Arm gebaut wurde.
      #
      # Die Regenerierung übernimmt der bestehende Schritt darunter: er
      # triggert auf `git diff scripts/fedlex-cache.sh` und sieht den Re-Pin
      # unabhängig davon, welche der beiden Achsen ihn erzeugt hat (§10 — den
      # vorhandenen Rahmen nutzen statt einen zweiten zu bauen).
      - name: Kanonik-Arbiter + Selbstheilung (isExemplifiedBy-Revision)
        run: |
          set -uo pipefail
          if npm run check:fedlex-versionen; then
            echo "Kanonik-Arbiter grün — jeder Pin zeigt auf die registrierte Manifestation."
            exit 0
          fi
          echo "── Kanonik-Arbiter ROT → Re-Pin auf die kanonische html-Revision ──"
          set -e
          npm run fedlex:repin-kanonik -- --write
          # Erneut prüfen: der Re-Pin ist die Massnahme, nicht der Beweis.
          # Bleibt der Arbiter rot, ist ein Fall dabei, den das Werkzeug nicht
          # löst (UNRESOLVED-Pin ohne html-Manifestation, überholte oder
          # aufgehobene Konsolidierung) — dann ROT statt eines PR, der eine
          # Heilung behauptet, die nicht stattfand (§8).
          npm run check:fedlex-versionen

      - name: Regenerierung (nur wenn cache.sh re-gepinnt wurde)
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/fedlex-cache.sh; then
            echo "Kein Re-Pin — keine Regenerierung nötig."
          else
            echo "cache.sh re-gepinnt → Snapshots/Struktur/Register regenerieren."
            # `--nur=bund` seit 1.9.2026 (QS-MONITOR-ROT, Befund (a2)): der Voll-Lauf
            # regenerierte 4860 Kantons-Snapshots mit reinem Datums-Churn; PR #596
            # (31.8.) kollidierte an vier ZH-Dateien mit der ZH-Tranche #606 und
            # blieb liegen, während der Monitor auf main am selben Pin rot stand.
            # Dieser Workflow hebt ausschliesslich BUND-Pins — die Kantons-Phasen
            # gehören nicht in seinen Diff (dieselbe Begründung wie bei
            # gen:pdf-quellen unten). Golden-Index wird gemischt, Kanton-Einträge
            # bleiben (scripts/normtext-snapshot.ts, Nur-Bund-Modus).
            npm run normtext -- --datum=${{ steps.datum.outputs.iso }} --nur=bund
            # ── Reihenfolge Register → pdf-quellen → Register ────────────────
            # ZWEI Läufe von normtext:register, mit Absicht (5.9.2026, Lauf
            # 33937353756). Die Kaskade ist zirkulär:
            #   · gen:pdf-quellen LIEST je Erlass den `fassungsToken` aus
            #     public/normtext/register.json und nimmt die pdf-a-URL, deren
            #     dateApplicability exakt diesem Token entspricht
            #     (scripts/normtext/pdf-quellen-generieren.ts, bundPdfQuellen).
            #   · normtext:register PROJIZIERT umgekehrt pdfUrl/pdfStand aus
            #     pdf-quellen.json (§5-Kaskade) — der Grund, aus dem der
            #     Generator am 29.8.2026 VOR das Register gestellt wurde
            #     (RDV-Re-Pin 2025-11-01 → 2026-08-20, PR #572 rot).
            # Genau diese eine Reihenfolge war der Defekt: der Generator sah nur
            # den ALTEN Token. Nach dem DBG-Re-Pin 2026-01-01 → 2026-09-02 zog er
            # deshalb das PDF der Fassung 2026-01-01, und check:pdf-quellen wurde
            # rot mit «DBG: PDF-Konsolidierung 2026-01-01 ≠ Pin 2026-09-02 —
            # Generator neu laufen»; der Arm endete ohne PR. Beide Läufe sind
            # idempotent, der erste liefert die frische Eingabe, der zweite die
            # Projektion — der 29.8.-Grund bleibt damit unangetastet.
            npm run normtext:register -- --datum=${{ steps.datum.outputs.iso }}
            # `--nur=bund`, weil dieser Workflow ausschliesslich BUND-Pins hebt:
            # eine Voll-Erhebung würde 1231 Kantons-Quellen neu befragen und
            # deren unabhängige Quell-Drift in den Reparatur-PR ziehen (gemessen
            # 29.8.2026: 13 BS-Erlasse verloren dabei ihren PDF-Link, weil die
            # Kantons-Sammlung inzwischen eine neuere Fassung führt — ein echter,
            # aber sachfremder Befund, der einen eigenen Schritt verdient).
            npm run gen:pdf-quellen -- --nur=bund
            npm run normtext:register -- --datum=${{ steps.datum.outputs.iso }}
            npm run normtext:struktur -- --datum=${{ steps.datum.outputs.iso }}
            # Churn-Reset seit 1.9.2026 (Befund (a2)): Dateien, die sich NUR in
            # `erzeugt`/`abgerufen` unterscheiden, zurück auf HEAD — der PR trägt
            # danach nur Substanz (Pin-Hebung, neue Fassung). Vor den abgeleiteten
            # Generatoren und vor dem Manifest, damit beide vom bereinigten
            # Stand ausgehen. Reset-Regel bisher nur von Hand (fedlex-cache.sh).
            npm run normtext:churn-reset -- --pfad=public/normtext
            npm run gen:fedlex-wiedervorlage -- --datum=${{ steps.datum.outputs.iso }}
            npm run gen:verfall
            # gen:historie VOR dem Manifest: Historie-Shards leiten aus den
            # Struktur-Sidecars ab (§5-Kaskade). Fehlte bis 15.8.2026 — PR #497
            # landete mit Sidecar-Änderung ohne Shard-Nachzug, check:historie
            # rot erst in der Hand-Nacharbeit entdeckt (Nullprobe-Beleg dort).
            npm run gen:historie
            # Ebenfalls seit 29.8.2026 (PR #572): beide leiten aus den oben neu
            # erzeugten Artefakten ab und blieben darum stehen — RDV.json aus den
            # Struktur-Sidecars (check:artikel-revisionen rot), der Startseiten-
            # Zähler aus den Registern (check:zaehler rot).
            npm run gen:artikel-revisionen
            npm run gen:zaehler
            # gen:feed seit 5.9.2026 (Lauf 33937353756): public/feed/erlasse.xml
            # leitet aus register.json ab (§5-Kaskade), wurde aber bisher NUR im
            # `build`-Skript erzeugt und fehlte hier ganz. Der Arm hob den Pin,
            # das Register änderte sich, der Feed blieb stehen — check:feed rot
            # mit «erlasse.xml VERALTET gegenüber dem Register».
            npm run gen:feed
            npm run datenhaltung:manifest
          fi

      - name: Diff feststellen
        id: diff
        run: |
          if git diff --quiet; then
            echo "geaendert=0" >> "$GITHUB_OUTPUT"
            echo "Kein Frische-Diff — nichts zu tun."
          else
            echo "geaendert=1" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # `check:golden-normtext` steht hier seit 13.8.2026 (PR #482, Runde 2) und
      # ist kein Zusatz, sondern DER Wächter dieses Schritts. Der
      # Regenerierungs-Schritt oben fährt `npm run normtext` als VOLL-Lauf; fällt
      # dabei eine Kantons-Quelle aus, verlor der Golden-Index bis zum
      # Wurzel-Fix in scripts/normtext-snapshot.ts die Drift-Basis der nicht
      # gelieferten Erlasse. Genau das geschah am 10.8.2026 (b84ee8302:
      # 56'113 → 32'640 Einträge, AR 6398→453, BS 17688→160) — und dieser
      # Tor-Block liess es durch, weil er das einzige Tor NICHT enthielt, das
      # den Index auf Vollständigkeit liest. `golden:vergleich` prüft die
      # ENGINE-Golden, nicht den Normtext-Index; die beiden sind verschiedene
      # Beweismittel und nur die Namensähnlichkeit legt Gleichheit nahe.
      # Der Commit behauptete danach «Offline-Tore grün» — die Behauptung war
      # wahr für die gefahrenen Tore und trotzdem irreführend (§8).
      # ci.yml fuhr das Tor (Zeile ~356) und wurde rot; der Schaden war da nur
      # nicht mehr abzuwenden, sondern bloss noch sichtbar.
      # ── 29.8.2026: HANDVERLESENE LISTE ABGESCHAFFT ──────────────────────────
      # Bis hierher standen acht namentlich aufgezählte Tore. Die Liste war
      # per Konstruktion unvollständig, und zwar wachsend: jedes neue `check:*`
      # musste jemand von Hand nachtragen. Am 29.8.2026 kostete genau das drei
      # Regressionen in EINEM Auto-Merge-PR (#572) — `check:pdf-quellen`
      # (RDV-PDF-Konsolidierung nicht nachgezogen), `check:artikel-revisionen`
      # (RDV.json veraltet) und `check:zaehler` (Startseiten-Zähler veraltet)
      # waren rot, standen aber nicht auf der Liste. Der Lauf meldete «Offline-
      # Tore grün» und eröffnete den PR. Die Behauptung war wahr für die
      # gefahrenen Tore und trotzdem irreführend (§8) — dieselbe Fehlerklasse,
      # die der Kommentar oben schon einmal für `check:golden-normtext`
      # beschreibt. Zweimal dieselbe Ursache, zweimal ein Nachtrag: der
      # Nachtrag war nie der Fix (§17).
      #
      # `npm run check` fährt stattdessen die GANZE Tor-Menge aus
      # `check:seriell` (heute 44, parallel über scripts/check-parallel.ts).
      # Damit deckt dieser Schritt jedes künftige Tor automatisch mit ab; die
      # Liste kann nicht mehr veralten, weil es keine mehr gibt.
      #
      # WARUM `npm run check` UND NICHT `npm run gate`: gate fährt zusätzlich
      # tsc/vitest/lint. Dieser Workflow ändert ausschliesslich Daten-Artefakte,
      # nie Quellcode — tsc und lint hätten hier nichts zu prüfen. `npm test`
      # steht trotzdem dabei, weil etliche Tests gegen die committeten
      # Projektionen laufen und ein Daten-Diff sie sehr wohl brechen kann.
      #
      # `check:gegenpruefung` ist in `check:seriell` enthalten und wäre hier
      # ein Problem — es liest den Working Tree, der in diesem Schritt absichtlich
      # schmutzig ist. Es schützt sich selbst: unter GITHUB_ACTIONS protokolliert
      # es SKIP und endet grün (scripts/gegenpruefung/kern.ts, CI-Selbstschutz).
      # Der Arbiter für den committeten Bereich ist `check:merge-schutz` in
      # ci.yml, das der PR unten ohnehin durchläuft.
      #
      # `golden:vergleich` bleibt explizit: es steht NICHT in `check:seriell`
      # (es ist ein eigener Gate-Schritt) und ist der Engine-Golden-Beweis.
      #
      # LAUFZEIT: der `tore`-Job in ci.yml fährt dieselbe Tor-Menge nach blossem
      # `npm ci` (ohne Build, ohne DB) und hält den 30-Minuten-Rahmen; hier kommt
      # sie zu den Netz-Schritten oben hinzu. timeout-minutes ist darum von 30
      # auf 45 gehoben.
      # OFFENER PUNKT (5.9.2026, Lauf 33937353756): `check:materialien` ist
      # WANDUHR-abhängig — es vergleicht `fristEnde` der Vernehmlassungen gegen
      # das heutige Datum (Finding 7) und wird an jedem Tag rot, an dem eine
      # Frist abgelaufen ist, ohne dass dieser Arm etwas damit zu tun hat. Der
      # Lauf oben scheiterte auch daran (VERN-2026-7, geheilt in PR #687). Das
      # wird hier NICHT aufgeweicht (kein Ausklammern, kein `|| true` — §6.7):
      # ein wanduhr-abhängiges Tor gehört an seiner Wurzel repariert, d. h. der
      # Vernehmlassungs-Generator muss im Frische-Kreislauf mitlaufen oder das
      # Tor auf einen erhobenen Stand statt auf `heute` prüfen. Bis dahin kann
      # dieser Arm an einem fremden Befund scheitern.
      - name: Offline-Tore vor dem PR (VOLLE Tor-Menge, keine Auswahl)
        if: steps.diff.outputs.geaendert == '1'
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run golden:vergleich

      - name: Reparatur-PR eröffnen + Auto-Merge (David-Rahmen 16.7.2026)
        if: steps.diff.outputs.geaendert == '1'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          DATUM: ${{ steps.datum.outputs.iso }}
        run: |
          set -euo pipefail
          branch="chore/fedlex-frische-${DATUM}"
          git config user.name  "fedlex-frische-bot"
          git config user.email "noreply@anthropic.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore(currency): Fedlex-Frische-Automatik ${DATUM} — Re-Pin/Wiedervorlage

          Automatischer Reparatur-Lauf (O-2.1/O-2.2). Re-Pin überholter Bund-Pins auf
          die geltende Fedlex-Konsolidierung + Currency/Wiedervorlage-Refresh.
          Offline-Tore grün (check:normtext, struktur-konsistenz, golden, verfall, paritaet).

          Roadmap: QS-OPT
          Gegenpruefung: ausstehend — automatischer Lauf, adversariale Pruefung nachgelagert
          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
          git push -u origin "$branch"
          # Idempotenz EXPLIZIT statt pauschalem `|| echo`: Ein bereits offener
          # PR für diesen Head ist der einzige tolerierte Fall. Jeder andere
          # create-Fehler lässt den Lauf ROT werden — am 27.7.2026 verschluckte
          # das pauschale Fangen den Fehler «GitHub Actions is not permitted to
          # create or approve pull requests» (Repo-Einstellung Settings → Actions
          # → General → «Allow GitHub Actions to create and approve pull
          # requests» war aus) und der Branch hing ohne PR, Lauf grün gemeldet.
          offen=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$offen" ]; then
            echo "PR #${offen} für ${branch} ist bereits offen (idempotent) — kein Neu-Eröffnen."
          else
            gh pr create --base main --head "$branch" \
              --title "chore(currency): Fedlex-Frische ${DATUM} (Auto-Merge)" \
              --body "Automatischer Frische-Lauf (O-2.1 Batch-Re-Pin + O-2.2 Wiedervorlage). David-Rahmen-Gate 16.7.2026 («Ja, voll freigeben»): scheduled Reparatur-PRs auto-mergen bei grünen Toren; main → Prod. Netz-Currency-Tor (check:fedlex-versionen) läuft im wöchentlichen Normen-Monitor. Die CI wird direkt nach dieser Eröffnung per workflow_dispatch angestossen (github.token löst selbst keine Workflows aus); bleibt trotzdem ein Required-Kontext offen, zieht ihn der tägliche Wächter nach."
          fi
          # ── CI auf dem Bot-PR explizit anstossen (K1, 3.8.2026) ──────────────
          # GitHub löst für Events, die `github.token` erzeugt, KEINE Workflows
          # aus (Rekursionssperre). Der PR-Body verwies bisher nur darauf, die
          # CI «ggf. manuell anzustossen» — ein Hinweis an einen Menschen ist
          # keine Automatik. Belegte Folge: die Läufe 30795814361 und
          # 30795814304 blieben in `action_required` stehen, der Bot-PR trug
          # keinen einzigen Required-Kontext und war damit nicht mergbar; genau
          # den Zustand, den auch `--auto` nicht auflöst, weil er auf Kontexte
          # wartet, die nie kommen.
          # `workflow_dispatch` ist die dokumentierte Ausnahme von der
          # Rekursionssperre — ein expliziter Dispatch läuft.
          # Fehlerseite: schlägt der Dispatch fehl, ist der PR bereits eröffnet
          # und sichtbar; der Wächter (waechter.yml) zieht fehlende Kontexte in
          # der nächsten Runde nach. Darum Warnung statt rotem Lauf.
          if gh workflow run ci.yml --ref "$branch"; then
            echo "CI (ci.yml) auf '${branch}' angestossen — die Required-Kontexte werden gemeldet."
          else
            echo "::warning::ci.yml-Dispatch auf '${branch}' fehlgeschlagen — der Wächter zieht die Kontexte nach."
          fi
          # Auto-Merge bleibt tolerant: scheitert NUR an Repo-Setting/Token-Rechten,
          # der PR existiert dann bereits sichtbar und wartet auf Abnahme.
          gh pr merge --auto --squash "$branch" || echo "Auto-Merge nicht aktivierbar (Repo-Setting/Token) — PR bleibt offen zur Abnahme."

      - name: Handschritt-Zettel (überholt, aber html-N nicht auflösbar)
        if: steps.repin.outputs.handschritt == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          offen=$(gh issue list --state open --search 'Fedlex-Re-Pin Handschritt in:title' --json number --jq '.[0].number // empty')
          rumpf="Ein überholter Bund-Pin ist NICHT automatisch re-pinnbar (keine kanonische html-Manifestation für die geltende Konsolidierung — oft: die Fassung ist eben erst in Kraft getreten, das HTML-Exemplar lagert noch nach). §7-Handschritt: html-N via SPARQL isExemplifiedBy prüfen, sobald verfügbar, dann fedlex:repin-batch erneut. Details im Lauf-Log: ${RUN_URL}"
          if [ -n "$offen" ]; then
            gh issue comment "$offen" --body "Erneut am $(date -u +%F). ${rumpf}"
          else
            gh issue create --title "🟠 Fedlex-Re-Pin Handschritt fällig ($(date -u +%F))" --body "$rumpf"
          fi
